<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sociales: Los Chortís</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(160deg,#fff6d6,#d9f2ff);color:#1f2a44;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}h1{text-align:center;font-size:2rem;margin:10px 0}h2{font-size:1.5rem;margin:8px 0}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(0,0,0,.1);margin:14px 0}
.btn{display:block;width:100%;font-size:1.3rem;padding:16px;margin:8px 0;border:0;border-radius:16px;cursor:pointer;color:#fff;background:#2b8de2;font-weight:700}
.btn.g{background:#22a35a}.btn.o{background:#f08a24}.btn.r{background:#c7362b}.btn.gray{background:#8a94a8}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}
.topics label{display:block;font-size:1.25rem;padding:10px;background:#e8f3ff;border-radius:12px;margin:6px 0;cursor:pointer}
.topics input{transform:scale(1.5);margin-right:12px}
.q{font-size:1.45rem;font-weight:700;margin:6px 0 14px}.opt{background:#eef1f6;color:#1f2a44;text-align:left}
.opt.ok{background:#22a35a;color:#fff}.opt.bad{background:#c7362b;color:#fff}
.exp{font-size:1.15rem;background:#fff6d6;border-left:6px solid #ffbf00;padding:12px;border-radius:10px;margin-top:10px}
.stats{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;padding:4px 10px;border-radius:10px;background:#ffd9cc;font-size:.95rem;font-weight:700}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;cursor:pointer;background:#e8f3ff}
.timer{font-size:2rem;text-align:center;font-weight:800;color:#c7362b}.hid{display:none}.msg{font-size:1.3rem;text-align:center;font-weight:700;min-height:1.6em}
ul{font-size:1.1rem}li{margin:6px 0}
</style></head><body><div class="wrap">
<p style="margin:0"><a href="https://korckyjals-grok-bot.github.io/sociales/" style="color:#2b8de2;font-weight:700;text-decoration:none">⬅️ Todos los pueblos</a></p>
<h1>🌄 Sociales: Los Chortís</h1>
<div id="home" class="card">
<p style="font-size:1.2rem;text-align:center">¡Hola, amiguito! ¡Aprende sobre los chortís jugando!</p>
<button class="btn g" onclick="showStudy()">📖 Estudiar</button>
<div class="topics" id="topics">
<label><input type="checkbox" value="ori" checked>🗺️ Origen y territorio</label>
<label><input type="checkbox" value="vid" checked>🌽 Vida y cultura</label>
<label><input type="checkbox" value="con" checked>🛡️ Conquista y legado</label>
</div>
<div class="row"><button class="btn" onclick="startPractice()">✏️ Practicar</button><button class="btn o" onclick="startChallenge()">⏱️ Desafío 60 s</button></div>
<p style="text-align:center;font-size:1.1rem">🏆 Récord del desafío: <b id="best">0</b></p>
</div>
<div id="study" class="card hid">
<h2 id="stTitle"></h2><div class="row" id="stTabs"></div>
<div id="fc" class="card fc" onclick="flip()"></div>
<p style="text-align:center">Toca la tarjeta para ver la respuesta</p>
<div class="row"><button class="btn gray" onclick="moveFc(-1)">⬅️ Anterior</button><button class="btn" onclick="moveFc(1)">Siguiente ➡️</button></div>
<button class="btn r" onclick="home()">🏠 Inicio</button>
</div>
<div id="play" class="card hid">
<div class="stats"><span>✅ <span id="sc">0</span></span><span>🔥 Racha: <span id="st">0</span></span><span id="cnt"></span></div>
<div id="tm" class="timer hid"></div>
<p><span class="tag" id="tg"></span></p>
<div class="q" id="qt"></div><div id="opts"></div>
<div id="msg" class="msg"></div><div id="exp" class="exp hid"></div>
<button class="btn g hid" id="nx" onclick="next()">Siguiente ➡️</button>
<button class="btn r" onclick="finish()">Terminar</button>
</div>
<div id="sum" class="card hid"><h2 id="sumT"></h2><p id="sumP" style="font-size:1.2rem"></p><div id="sumL"></div>
<button class="btn o hid" id="rep" onclick="repeatErrors()">🔁 Repasar errores</button>
<button class="btn" onclick="home()">🏠 Inicio</button></div>
</div>
<script>
const TN={"ori": "Origen y territorio", "vid": "Vida y cultura", "con": "Conquista y legado"};
const Q=[{"c": "ori", "t": "m", "q": "¿A qué gran familia de pueblos pertenecen los chortís?", "o": ["A los mayas", "A los nahuas", "A los incas", "A los lencas"], "e": "Los chortís (ch'orti') son un pueblo maya."}, {"c": "ori", "t": "m", "q": "¿En qué zona de El Salvador vivían los chortís?", "o": ["En el norte: Chalatenango y la zona de Metapán", "En el oriente, en La Unión", "En la costa de Sonsonate", "En las islas del golfo"], "e": "Vivían en el norte del país."}, {"c": "ori", "t": "m", "q": "¿Qué municipios de Chalatenango tienen los registros más claros del idioma chortí?", "o": ["Tejutla y Citalá", "Izalco y Nahuizalco", "Cacaopera y Lislique", "Chalchuapa y Ahuachapán"], "e": "En el siglo XVIII se registró el chortí como idioma materno en Tejutla y Citalá."}, {"c": "ori", "t": "m", "q": "¿En qué países viven hoy la mayoría de los chortís?", "o": ["Guatemala y Honduras", "México y Cuba", "Panamá y Colombia", "España y Portugal"], "e": "Hoy viven sobre todo en el oriente de Guatemala y el occidente de Honduras."}, {"c": "ori", "t": "m", "q": "¿Qué famosa ciudad maya de Honduras está en la región chortí?", "o": ["Copán", "Tazumal", "Machu Picchu", "Teotihuacán"], "e": "Copán está en tierra chortí; muchos expertos relacionan su antigua lengua con el chortí."}, {"c": "ori", "t": "m", "q": "¿Qué idioma hablan los chortís?", "o": ["El chortí (ch'orti'), una lengua maya", "El náhuat", "El mangue", "El potón"], "e": "El chortí es de la rama cholana de las lenguas mayas."}, {"c": "ori", "t": "v", "q": "El idioma chortí está extinto en todo el mundo.", "a": false, "e": "Falso. Ya no se habla en El Salvador, pero sigue vivo en Guatemala y Honduras."}, {"c": "ori", "t": "m", "q": "¿Con qué escritura antigua se relaciona la lengua chortí?", "o": ["Con los glifos mayas clásicos", "Con el alfabeto griego", "Con los jeroglíficos egipcios", "Con el chino"], "e": "Muchos expertos creen que la lengua de las inscripciones mayas clásicas es antepasada del chortí."}, {"c": "ori", "t": "m", "q": "¿Qué otro pueblo maya vivía en el occidente de El Salvador?", "o": ["Los pocomames", "Los chorotegas", "Los kakawiras", "Los incas"], "e": "Los pocomames vivían en Chalchuapa y Ahuachapán."}, {"c": "ori", "t": "m", "q": "¿Qué departamento es Chalatenango, según su ubicación?", "o": ["Un departamento del norte, fronterizo con Honduras", "Un departamento de la costa", "Una isla", "Un departamento del oriente junto al golfo"], "e": "Chalatenango está en el norte y limita con Honduras."}, {"c": "ori", "t": "v", "q": "Tejutla es considerado el municipio más antiguo de Chalatenango y de ascendencia chortí.", "a": true, "e": "¡Cierto! Así lo señalan estudios de la Universidad de El Salvador."}, {"c": "ori", "t": "m", "q": "¿Qué pueblo llegó también a Chalatenango y convivió con los chortís?", "o": ["Los nahuas-pipiles", "Los incas", "Los vikingos", "Los romanos"], "e": "Pipiles y lencas también vivieron en Chalatenango."}, {"c": "ori", "t": "m", "q": "¿Qué lugar de Santa Ana se incluye en la antigua zona chortí?", "o": ["Metapán", "Chalchuapa", "Coatepeque", "Santa Ana centro"], "e": "Metapán, en el norte de Santa Ana."}, {"c": "ori", "t": "v", "q": "Muchos nombres de lugares de Chalatenango son de origen náhuat, aunque allí vivieran chortís.", "a": true, "e": "¡Cierto! Tejutla y Chalatenango son nombres náhuat."}, {"c": "vid", "t": "m", "q": "¿Cuál es el alimento más importante de los chortís?", "o": ["El maíz", "El trigo", "El arroz", "La papa"], "e": "El maíz es sagrado para los pueblos mayas."}, {"c": "vid", "t": "m", "q": "¿Qué siembran en la milpa?", "o": ["Maíz, frijol, ayote y chile", "Uvas y aceitunas", "Trigo", "Manzanas"], "e": "La milpa es la siembra tradicional."}, {"c": "vid", "t": "m", "q": "¿Para qué piden la lluvia en sus ceremonias tradicionales?", "o": ["Para que crezcan las cosechas", "Para ir a nadar", "Para lavar carros", "Para hacer nieve"], "e": "Los chortís de Guatemala y Honduras aún hacen ceremonias para pedir lluvia."}, {"c": "vid", "t": "m", "q": "¿Qué artesanías son típicas de los chortís?", "o": ["Cerámica, cestería, petates y hamacas", "Joyas de platino", "Celulares", "Vidrio soplado"], "e": "Hacen ollas de barro, canastos y tejidos de fibras."}, {"c": "vid", "t": "m", "q": "¿Con qué fibra tejen bolsas y hamacas?", "o": ["Con fibras como el maguey", "Con plástico", "Con hilo de cobre", "Con papel"], "e": "El maguey o mezcal es una fibra vegetal resistente."}, {"c": "vid", "t": "m", "q": "¿Cómo son sus creencias tradicionales?", "o": ["Respetan la tierra, la lluvia, el sol y el maíz", "No tienen ninguna", "Adoran dioses griegos", "Son budistas"], "e": "Su espiritualidad maya honra la naturaleza."}, {"c": "vid", "t": "m", "q": "¿Cómo eran sus casas tradicionales?", "o": ["De bahareque con techo de paja o palma", "De vidrio", "De acero", "De hielo"], "e": "Casas de bahareque con techo de paja."}, {"c": "vid", "t": "v", "q": "Los ancianos son muy respetados en las comunidades chortís.", "a": true, "e": "¡Cierto! Guardan la sabiduría y las tradiciones."}, {"c": "vid", "t": "m", "q": "¿Qué usaban para moler el maíz?", "o": ["La piedra de moler", "Una licuadora", "Un molino eléctrico", "Un martillo"], "e": "La piedra de moler es tradicional."}, {"c": "vid", "t": "m", "q": "¿Qué conocimientos tenían los antiguos mayas, antepasados de los chortís?", "o": ["Matemáticas con el cero, astronomía y calendarios", "Computadoras", "Aviones", "Electricidad"], "e": "Los mayas usaban el cero e hicieron calendarios exactos."}, {"c": "vid", "t": "m", "q": "¿Qué eran los códices mayas?", "o": ["Libros pintados en papel de corteza", "Teléfonos", "Monedas", "Barcos"], "e": "Escribían con glifos en libros llamados códices."}, {"c": "vid", "t": "v", "q": "Los chortís tradicionales cuentan el tiempo con ayuda de la naturaleza y las estaciones.", "a": true, "e": "¡Cierto! La siembra sigue las lluvias."}, {"c": "con", "t": "m", "q": "¿Cuándo conquistaron los españoles la zona chortí?", "o": ["Hacia la década de 1530", "En 1821", "En 1492", "En 1950"], "e": "La región chortí fue conquistada hacia mediados de la década de 1530."}, {"c": "con", "t": "m", "q": "¿Qué causó muchas muertes indígenas tras la conquista?", "o": ["Enfermedades de Europa", "El frío", "Los meteoritos", "Los dinosaurios"], "e": "Enfermedades como la viruela."}, {"c": "con", "t": "v", "q": "El chortí dejó de hablarse como lengua de la comunidad en El Salvador.", "a": true, "e": "¡Cierto! El castellano lo reemplazó."}, {"c": "con", "t": "m", "q": "¿Qué religión trajeron los españoles?", "o": ["El cristianismo católico", "El islam", "El budismo", "Ninguna"], "e": "Los misioneros enseñaron la religión católica."}, {"c": "con", "t": "m", "q": "¿Qué sitio maya de Honduras, cerca de El Salvador, se puede visitar para conocer el mundo chortí?", "o": ["Las ruinas de Copán", "La Torre Eiffel", "El Coliseo", "Machu Picchu"], "e": "Copán Ruinas es Patrimonio de la Humanidad."}, {"c": "con", "t": "m", "q": "¿Qué ciudad de Guatemala es un centro chortí importante hoy?", "o": ["Jocotán", "Cancún", "Panamá", "Bogotá"], "e": "Jocotán y Camotán (Chiquimula) son centros chortís."}, {"c": "con", "t": "m", "q": "¿Qué pueden aprender hoy los niños chortís de Guatemala en la escuela?", "o": ["Su idioma chortí, además del español", "Solo japonés", "Nada", "Solo latín"], "e": "Hay programas de educación bilingüe."}, {"c": "con", "t": "v", "q": "Las leyendas de Chalatenango conservan parte de la herencia indígena, incluida la chortí.", "a": true, "e": "¡Cierto! Estudios muestran que las leyendas guardan la cosmovisión ancestral."}, {"c": "con", "t": "m", "q": "¿Qué alimento maya seguimos comiendo hoy?", "o": ["Tortillas, tamales y atol de maíz", "Pizza", "Sushi", "Croissant"], "e": "El maíz es herencia indígena."}, {"c": "con", "t": "m", "q": "¿Por qué se dice que El Salvador tiene herencia maya?", "o": ["Porque aquí vivieron pueblos mayas como chortís y pocomames", "Porque lo dice una película", "Porque llegó de Europa", "No tiene herencia maya"], "e": "Chortís, pocomames y antiguos mayas vivieron aquí."}, {"c": "con", "t": "v", "q": "Conocer a los pueblos originarios nos ayuda a entender nuestra identidad.", "a": true, "e": "¡Cierto! Su historia es parte de la nuestra."}, {"c": "ori", "t": "m", "q": "¿A qué rama de las lenguas mayas pertenece el chortí?", "o": ["Cholana", "Nahua", "Lenca", "Misumalpa"], "e": "El chortí es de la rama cholana."}, {"c": "vid", "t": "m", "q": "¿Qué sistema de numeración usaban los antiguos mayas?", "o": ["Contaban de 20 en 20", "De 2 en 2", "Solo hasta 10", "No contaban"], "e": "Usaban un sistema vigesimal (base 20)."}, {"c": "con", "t": "m", "q": "¿En qué departamento de Guatemala viven muchos chortís?", "o": ["Chiquimula", "Petén", "Quetzaltenango", "Escuintla"], "e": "Chiquimula (Jocotán, Camotán) es zona chortí."}];
const CARDS={"ori": [["¿Quiénes son los chortís?", "Un pueblo maya que vivió en el norte de El Salvador."], ["¿Dónde vivieron?", "Chalatenango y la zona de Metapán; los registros más claros son de Tejutla y Citalá."], ["Hoy viven en", "El oriente de Guatemala y el occidente de Honduras."], ["Idioma", "El chortí (ch'orti'), lengua maya cholana. Ya no se habla en El Salvador."], ["Copán", "Gran ciudad maya en tierra chortí (Honduras)."]], "vid": [["Alimentación", "La milpa: maíz, frijol, ayote y chile."], ["Creencias", "Respeto a la tierra, la lluvia y el maíz; ceremonias para pedir lluvia."], ["Artesanías", "Cerámica, cestería, petates y hamacas de maguey."], ["Sabiduría maya", "El cero, la astronomía, los calendarios y los códices."], ["Los ancianos", "Muy respetados, guardan las tradiciones."], ["Base 20", "Los mayas contaban de 20 en 20 y usaban el cero."]], "con": [["La conquista", "La zona chortí fue conquistada hacia la década de 1530."], ["Su idioma hoy", "Desapareció en El Salvador; vive en Guatemala y Honduras."], ["Para visitar", "Copán Ruinas (Honduras), Patrimonio de la Humanidad."], ["Herencia", "Leyendas de Chalatenango y comidas de maíz."]]};
Q.forEach((q,i)=>q.id=i);
const $=id=>document.getElementById(id);
let pool=[],cur=null,score=0,streak=0,done=0,missed={},answered=false,chal=false,timer=null,left=0,weight={},last=-1;
$("best").textContent=localStorage.getItem("chortis_best")||0;
function show(id){["home","study","play","sum"].forEach(x=>$(x).classList.toggle("hid",x!==id))}
function home(){stop();$("best").textContent=localStorage.getItem("chortis_best")||0;show("home")}
function sel(){const s=[...document.querySelectorAll("#topics input:checked")].map(i=>i.value);return s.length?s:["ori","vid","con"]}
let fcT="ori",fcI=0,fcF=false;
function showStudy(){$("stTabs").innerHTML=Object.keys(TN).map(k=>`<button class="btn ${k==fcT?'g':'gray'}" onclick="fcT='${k}';fcI=0;showStudy()">${TN[k]}</button>`).join("");$("stTitle").textContent="📖 "+TN[fcT];fcF=false;drawFc();show("study")}
function drawFc(){const c=CARDS[fcT][fcI];$("fc").innerHTML=fcF?`<div>${c[1]}</div>`:`<b>${c[0]}</b>`}
function flip(){fcF=!fcF;drawFc()}
function moveFc(d){const n=CARDS[fcT].length;fcI=(fcI+d+n)%n;fcF=false;drawFc();$("stTitle").textContent=`📖 ${TN[fcT]} (${fcI+1}/${n})`}
function begin(list,isChal){pool=list;score=0;streak=0;done=0;missed={};weight={};last=-1;chal=isChal;list.forEach(q=>weight[q.id]=1);
$("sc").textContent=0;$("st").textContent=0;show("play");stop();
if(chal){left=60;$("tm").classList.remove("hid");$("tm").textContent="⏱️ 60";timer=setInterval(()=>{left--;$("tm").textContent="⏱️ "+left;if(left<=0)finish()},1000)}else $("tm").classList.add("hid");next()}
function startPractice(){const s=sel();begin(Q.filter(q=>s.includes(q.c)),false)}
function startChallenge(){const s=sel();begin(Q.filter(q=>s.includes(q.c)),true)}
function repeatErrors(){begin(Q.filter(q=>missed[q.id]),false)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function pick(){let tot=0;const c=pool.filter(q=>q.id!==last||pool.length==1);c.forEach(q=>tot+=weight[q.id]);let r=Math.random()*tot;for(const q of c){r-=weight[q.id];if(r<=0)return q}return c[0]}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function next(){cur=pick();last=cur.id;answered=false;$("tg").textContent=TN[cur.c]+(cur.t=="v"?" · ¿Verdadero o falso?":"");
$("qt").textContent=cur.q;$("cnt").textContent="Preguntas: "+done;
let opts,right;if(cur.t=="m"){opts=shuf(cur.o);right=cur.o[0]}else if(cur.t=="v"){opts=["Verdadero","Falso"];right=cur.a?"Verdadero":"Falso"}else{opts=["Mayas","Pipiles"];right=cur.a}
cur.right=right;$("opts").innerHTML="";opts.forEach(o=>{const b=document.createElement("button");b.className="btn opt";b.textContent=o;b.onclick=()=>answer(b,o);$("opts").appendChild(b)});
$("msg").textContent="";$("exp").classList.add("hid");$("nx").classList.add("hid")}
const GOOD=["¡Muy bien! 🎉","¡Excelente! ⭐","¡Correcto! 👏","¡Eres un crack! 🚀","¡Súper! 💪"];
function answer(b,o){if(answered)return;answered=true;done++;const ok=o===cur.right;
[...$("opts").children].forEach(x=>{if(x.textContent===cur.right)x.classList.add("ok")});
if(ok){score++;streak++;weight[cur.id]=Math.max(1,weight[cur.id]-1);$("msg").textContent=GOOD[Math.floor(Math.random()*GOOD.length)]+(streak>=3?` ¡Racha de ${streak}! 🔥`:"")}
else{b.classList.add("bad");streak=0;missed[cur.id]=1;weight[cur.id]+=3;$("msg").textContent="¡Casi! Mira la respuesta correcta 💡"}
$("sc").textContent=score;$("st").textContent=streak;$("cnt").textContent="Preguntas: "+done;
if(chal){setTimeout(()=>{if(chal&&left>0)next()},ok?600:1600);return}
$("exp").textContent="ℹ️ "+cur.e;$("exp").classList.remove("hid");$("nx").classList.remove("hid")}
function finish(){stop();const wasChal=chal;chal=false;let t="¡Buen trabajo, amiguito! 🌟";
if(wasChal){const best=+(localStorage.getItem("chortis_best")||0);if(score>best){localStorage.setItem("chortis_best",score);t="🏆 ¡Nuevo récord: "+score+"!"}}
$("sumT").textContent=t;$("sumP").textContent=`Respondiste bien ${score} de ${done} preguntas.`;
const m=Q.filter(q=>missed[q.id]);$("sumL").innerHTML=m.length?"<h3>Para repasar:</h3><ul>"+m.map(q=>`<li><b>${q.q}</b><br>✔️ ${q.t=="m"?q.o[0]:q.t=="v"?(q.a?"Verdadero":"Falso"):q.a} — ${q.e}</li>`).join("")+"</ul>":"<p>¡No tuviste errores! 🎉</p>";
$("rep").classList.toggle("hid",!m.length);show("sum")}
</script></body></html>
